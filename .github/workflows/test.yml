name: Test and lint

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build component
        run: npm run build:component

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Publish preview (PR only)
        if: github.event_name == 'pull_request'
        run: npx pkg-pr-new publish || echo "pkg-pr-new publish skipped"
